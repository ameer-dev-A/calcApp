<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <meta property="og:title" content="calculater app">
<meta property="og:description" content="calc amount of tip">
<meta property="og:type" content="website">
<meta property="og:url" content="https://ameer-dev-a.github.io/calcApp/">
<meta property="og:image" content="https://ameer-dev-a.github.io/calcApp/design/desktop-design-completed.jpg">
<meta property="og:image:alt" content="calculater app">

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
   <link rel="stylesheet" href="calc.css">
  <title>Frontend Mentor | Tip calculator app</title>
</head> 
<body>
  <div class="logo">
     <img src="images\logo.svg" width="75px">
  </div>
 <br>

      <div class="calc">
        <div class="dat">
           <p>Bill</p>
        <input class="dat1" type="text" placeholder="0">
        <p> Select Tip %</p>
        <div class="btns">
          <button type="button" value="5%">5%</button>
          <button type="button" value="10%">10%</button>
          <button type="button" value="15%">15%</button>
          <button type="button" value="25%">25%</button>
          <button type="button" value="50%">50%</button>
          <input id="custom" type="text"  placeholder="Custom">
        </div>
        <div class="num">
           <p> Number of People</p>
           <p class="zero">Can't be zero</p>
        </div>
       
        <input class="dat2" type="text" placeholder="0">
        </div>
       

        <div class="res">
          <div class="res1">
            <div class="res22">
              <p>  Tip Amount</p>
              <span> / person</span>
            </div>
            <h1 class="res11"></h1>
          </div>
          <div class="res2">
            <div class="res22">
             <p>Total</p>
            <span> / person</span>
            </div>
            <h1 class="res222"></h1>
          </div>
          <button class="rest" type="button">Reset</button>
        </div>
    </div>
    
  <br>  
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="https://github.com/ameer-dev-A">Ameer</a>.
  </footer>

  <script src="calc.js"> </script>
</body>
</html>
